name: Build Mac app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: AppleSilicon
          - os: macos-15-intel
            name: Intel
    runs-on: ${{ matrix.os }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate app folder
        run: |
          F=$(find . -name build_app.sh -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error title=Missing::build_app.sh was not found anywhere in the repository. Files present:"
            find . -not -path './.git/*' -not -path './.git' | head -40 | while read -r l; do echo "::error title=repo file::$l"; done
            exit 1
          fi
          echo "APPDIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Found app folder: $(dirname "$F")"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app
        working-directory: ${{ env.APPDIR }}
        run: |
          set +e
          bash build_app.sh 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error title=Build failed::exit $code"
            grep -E "rror|Traceback|fatal" build.log | head -25 | while read -r l; do echo "::error title=compiler::$l"; done
            tail -15 build.log | while read -r l; do echo "::warning title=tail::$l"; done
          fi
          exit $code
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign and notarize
        if: env.HAS_CERT == 'true'
        working-directory: ${{ env.APPDIR }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          bash sign_and_notarize.sh 2>&1 | tee sign.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error title=Signing failed::exit $code"
            tail -40 sign.log | while read -r l; do echo "::error title=sign::$l"; done
          fi
          exit $code
      - name: Ad-hoc sign (no certificate configured)
        if: env.HAS_CERT != 'true'
        working-directory: ${{ env.APPDIR }}
        run: codesign --force --deep --sign - "dist/Tzone Config.app"
      - name: Zip
        working-directory: ${{ env.APPDIR }}
        run: ditto -c -k --keepParent "dist/Tzone Config.app" "TzoneConfig-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TzoneConfig-${{ matrix.name }}
          path: ${{ env.APPDIR }}/TzoneConfig-${{ matrix.name }}.zip
